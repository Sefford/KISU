name: Deploy Docs

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Generate Dokka docs
        run: ./gradlew :lib:dokkaGenerate

      - name: Verify Dokka output
        run: |
          test -f lib/build/docs/index.html || {
            echo "Expected Dokka HTML docs at lib/build/docs/index.html"
            exit 1
          }

      - name: Disable Jekyll processing
        run: touch lib/build/docs/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package Pages artifact
        run: |
          mkdir -p dist
          tar --dereference --hard-dereference -cvf dist/github-pages.tar -C lib/build/docs .
          gzip -f dist/github-pages.tar

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: dist/github-pages.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
